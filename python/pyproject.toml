[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ipsofactura"
version = "0.1.0"
description = "Cliente oficial de Ipsofactura — timbrado CFDI 4.0 para México"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]
keywords = ["cfdi", "facturacion", "sat", "mexico", "ipsofactura"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Palenca-LTDA/ipsofactura-sdk"
Repository = "https://github.com/Palenca-LTDA/ipsofactura-sdk"
"Bug Tracker" = "https://github.com/Palenca-LTDA/ipsofactura-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipsofactura*"]
