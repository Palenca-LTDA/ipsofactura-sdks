name: SDK Auto-Release

# Triggered automatically whenever docs/openapi.json changes on main.
# Classifies the diff (breaking vs non-breaking), regenerates both SDKs,
# bumps versions, commits them back, then publishes to npm and PyPI.

on:
  push:
    branches: [main]
    paths:
      - 'docs/openapi.json'

permissions:
  contents: write   # commit version bumps + push git tag
  id-token: write   # OIDC – Trusted Publishers on PyPI

jobs:
  sdk-release:
    name: "Classify → Regen → Bump → Publish"
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD^ for the openapi diff

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 1. Classify: breaking or non-breaking ───────────────────────────
      - name: Extract previous openapi.json
        run: |
          git show HEAD^:docs/openapi.json > /tmp/openapi-old.json 2>/dev/null || \
            printf '{"openapi":"3.0.0","info":{"title":"empty","version":"0.0.0"},"paths":{}}\n' \
              > /tmp/openapi-old.json

      - name: Install oasdiff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo tufin/oasdiff --limit 1 --json tagName -q '.[0].tagName')
          VER="${TAG#v}"
          curl -sSfL \
            "https://github.com/tufin/oasdiff/releases/download/${TAG}/oasdiff_${VER}_linux_amd64.tar.gz" \
            | tar -xzC /tmp
          sudo mv /tmp/oasdiff /usr/local/bin/

      - name: Classify change (breaking vs non-breaking)
        id: classify
        run: |
          set +e
          oasdiff breaking /tmp/openapi-old.json docs/openapi.json --fail-on WARN \
            > /tmp/oasdiff-out.txt 2>&1
          EXIT=$?
          set -e
          cat /tmp/oasdiff-out.txt
          if [ "$EXIT" -eq 0 ]; then
            echo "bump=patch"               >> "$GITHUB_OUTPUT"
            echo "change_type=non-breaking" >> "$GITHUB_OUTPUT"
          else
            echo "bump=major"           >> "$GITHUB_OUTPUT"
            echo "change_type=breaking" >> "$GITHUB_OUTPUT"
          fi
          echo "sdk_release classify: change_type=$(grep change_type "$GITHUB_OUTPUT" | cut -d= -f2) bump=$(grep '^bump=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      # ── 2. Node SDK ─────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node deps
        working-directory: js
        run: npm ci

      - name: Regenerate TypeScript types from OpenAPI spec
        run: npx --yes openapi-typescript docs/openapi.json -o js/src/schema.d.ts

      - name: Bump Node version
        id: node-bump
        working-directory: js
        run: |
          npm version ${{ steps.classify.outputs.bump }} --no-git-tag-version
          NODE_VER=$(node -p "require('./package.json').version")
          echo "version=${NODE_VER}" >> "$GITHUB_OUTPUT"
          echo "sdk_release node_version=${NODE_VER}"

      - name: Build Node SDK
        working-directory: js
        run: npm run build

      # ── 3. Python SDK ───────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: pip install openapi-python-client build tomli_w

      - name: Regenerate Python client
        # Runs only when the client was originally generated by openapi-python-client
        # (i.e. .openapi-python-client.yml exists). If the client is handcrafted,
        # this step is skipped and only the version bump + publish happen.
        working-directory: python
        run: |
          if [ -f .openapi-python-client.yml ]; then
            openapi-python-client update --path ../docs/openapi.json
            echo "sdk_release python_regen=updated"
          else
            echo "sdk_release python_regen=skipped (no .openapi-python-client.yml — handcrafted client)"
          fi

      - name: Bump Python version
        id: python-bump
        env:
          BUMP_TYPE: ${{ steps.classify.outputs.bump }}
        run: |
          python3 - <<'EOF'
          import tomllib, tomli_w, pathlib, os

          path = pathlib.Path("python/pyproject.toml")
          data = tomllib.loads(path.read_text())
          major, minor, patch = (int(x) for x in data["project"]["version"].split("."))

          if os.environ["BUMP_TYPE"] == "major":
              major, minor, patch = major + 1, 0, 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          data["project"]["version"] = new_version
          path.write_text(tomli_w.dumps(data))

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              print(f"version={new_version}", file=fh)
          print(f"sdk_release python_version={new_version}")
          EOF

      - name: Build Python package
        working-directory: python
        run: python3 -m build

      # ── 4. Commit version bumps + tag ───────────────────────────────────
      - name: Commit version bumps and tag
        run: |
          git add js/package.json js/src/schema.d.ts \
                  python/pyproject.toml python/ipsofactura/
          git diff --cached --stat
          git commit -m "chore: sdk v${{ steps.node-bump.outputs.version }} (${{ steps.classify.outputs.change_type }}) [skip ci]"
          git tag "v${{ steps.node-bump.outputs.version }}"
          git push origin main --follow-tags

      # ── 5. Publish ──────────────────────────────────────────────────────
      - name: Publish to npm
        working-directory: js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
